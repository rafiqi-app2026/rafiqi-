<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>رفيقي</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0032A0"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F3F7FF;--card:#fff;--tx:#0B1B3F;--sub:#5B6B8C;--pr:#1D5BFF;--bd:#DCE5F7;--oth:#E8EFFF;--dg:#D93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071130;--card:#0F1D45;--tx:#F2F6FF;--sub:#9DB0D8;--pr:#3D7BFF;--bd:#1C2E63;--oth:#16295C;--dg:#FF6B60}}
:root[data-theme="dark"]{--bg:#071130;--card:#0F1D45;--tx:#F2F6FF;--sub:#9DB0D8;--pr:#3D7BFF;--bd:#1C2E63;--oth:#16295C;--dg:#FF6B60}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:15px}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:auto}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}header img{width:34px;height:34px;border-radius:9px}header b{flex:1;font-size:17px}
main{flex:1;overflow-y:auto;padding:12px;animation:fd .25s}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 6px;font:inherit;font-size:11px;position:relative}nav button span{display:block;font-size:20px}nav button.on{color:var(--pr);font-weight:700}
.bd{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--dg);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;font-style:normal}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}.card p{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>b{flex:1}small{color:var(--sub)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--oth);flex:none}
textarea,input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600}.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:7px 12px;font:inherit}.red{color:var(--dg);border-color:var(--dg)}
.acts{display:flex;gap:6px;margin-top:6px}.acts button{background:none;border:0;color:var(--sub);font:inherit;padding:4px 8px}.acts .on{color:var(--dg)}
.pi{max-width:100%;border-radius:10px;margin-top:6px}.quote{border-inline-start:3px solid var(--pr);padding:4px 10px;margin:6px 0;background:var(--oth);border-radius:8px}.cm{margin:6px 0;padding-inline-start:10px;border-inline-start:2px solid var(--bd)}.cm.r{margin-inline-start:18px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:50}.sh{background:var(--card);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:8px}.sh h3{margin:0}
.emo{display:flex;flex-wrap:wrap;gap:6px}.emo button{font-size:22px;border:2px solid transparent;background:var(--oth);border-radius:10px}.emo .on{border-color:var(--pr)}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}.opt.ok{background:#1e9e5a;color:#fff}.opt.no{background:var(--dg);color:#fff}
#toast{position:fixed;top:12px;inset-inline:12px;margin:auto;max-width:360px;background:var(--pr);color:#fff;padding:10px 14px;border-radius:12px;z-index:99;text-align:center;display:none}
#splash{position:fixed;inset:0;background:#0032A0;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .5s}#splash img{width:200px;border-radius:44px}
h4{margin:12px 2px 6px}.tag{font-size:11px;background:var(--oth);padding:2px 8px;border-radius:8px}.auth{max-width:380px;margin:20px auto;text-align:center}.auth img{width:120px;border-radius:28px}
</style></head><body>

 if(me.error)throw me.error;S.me=me.data;S.people={};(pp.data||[]).forEach(p=>S.people[p.id]=p);S.people[S.uid]=Object.assign({},S.people[S.uid]||{},S.me);S.fr=fr.data||[];S.bl=bl.data||[];S.posts=po.data||[];S.att=at.data||[];

async function enter(){await load();S.view='home';draw(true)}
const A={
tab:id=>{S.q='';S.view=id;draw(true)},theme:()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'},
sw:()=>{S.mode=S.mode==='login'?'register':'login';authView()},
go:async()=>{const e=$('#ae').value.trim(),p=$('#ap').value,r=$('#ar');r.textContent='';try{if(S.mode==='register'){const n=$('#an').value.trim(),u=$('#au').value.trim().toLowerCase();if(!n){r.textContent='اكتب اسمك';return}if(!/^[a-z0-9_]{3,20}$/.test(u)){r.textContent='اسم المستخدم: 3-20 حرفاً إنجليزياً صغيراً أو أرقاماً أو _';return}const f=await sb.rpc('username_available',{u});if(f.error)throw f.error;if(!f.data){r.textContent='اسم المستخدم محجوز، اختر غيره';return}const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{username:u,full_name:n}}});if(error)throw error;if(!data.session){r.textContent='تم إنشاء الحساب. سجّل الدخول الآن.';S.mode='login';return}S.uid=data.session.user.id}else{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;S.uid=data.session.user.id}await enter()}catch(x){r.textContent=errAr(x)}},
logout:async()=>{await sb.auth.signOut();S.uid=null;S.mode='login';authView()},
pimg:()=>pick(u=>{S.pimg=u;$('#pp').textContent='✅ أُرفقت صورة'}),
post:async()=>{const t=$('#pt').value.trim();if(!t&&!S.pimg)return;await W(sb.from('posts').insert({author:S.uid,body:t,image_url:S.pimg}));S.pimg=null;S.view='home';draw(true)},
like:async id=>{const y=S.likes.some(l=>l.post_id===id&&l.user_id===S.uid);await W(y?sb.from('post_likes').delete().eq('post_id',id).eq('user_id',S.uid):sb.from('post_likes').insert({post_id:id,user_id:S.uid}))},
tcm:id=>{S.open[id]=!S.open[id];draw()},cmt:id=>ask('تعليق',t=>W(sb.from('comments').insert({post_id:id,author:S.uid,body:t}))),
rcm:(id,b)=>ask('رد',t=>W(sb.from('comments').insert({post_id:b.dataset.p,author:S.uid,body:t,parent_id:id}))),dcm:id=>W(sb.from('comments').delete().eq('id',id)),
share:id=>W(sb.from('posts').insert({author:S.uid,body:'',shared_post:id})).then(()=>toast('تمت المشاركة')),
delp:id=>W(sb.from('posts').delete().eq('id',id)),rep:id=>ask('سبب الإبلاغ',async t=>{const {error}=await sb.from('reports').insert({post_id:id,reporter:S.uid,reason:t});toast(error?'سبق أن أبلغت عن هذا المنشور':'تم إرسال البلاغ');await load();draw()}),
freq:u=>{const [a,b]=pr(S.uid,u);return W(sb.from('friendships').insert({user_a:a,user_b:b,requester:S.uid}))},
facc:u=>{const [a,b]=pr(S.uid,u);return W(sb.from('friendships').update({status:'accepted'}).eq('user_a',a).eq('user_b',b))},
frej:u=>{const [a,b]=pr(S.uid,u);return W(sb.from('friendships').delete().eq('user_a',a).eq('user_b',b))},frem:u=>A.frej(u),
blk:u=>W(sb.from('blocks').insert({blocker:S.uid,blocked:u})),unblk:u=>W(sb.from('blocks').delete().eq('blocker',S.uid).eq('blocked',u)),
play:id=>{S.play={id,i:0,sc:0,sel:null};S.view='play';draw()},
ans:id=>{const P=S.play;if(P.sel!=null)return;const Q=QZ.find(q=>q.id===P.id);P.sel=+id;if(+id===Q.q[P.i][2])P.sc+=10;draw()},
next:async()=>{const P=S.play,Q=QZ.find(q=>q.id===P.id);P.i++;P.sel=null;if(P.i>=Q.q.length){const k=pk(Q),o=S.att.find(a=>a.user_id===S.uid&&a.qid===Q.id&&a.period===k);if(!o||P.sc>o.score){const {error}=await sb.from('attempts').upsert({user_id:S.uid,qid:Q.id,period:k,score:P.sc},{onConflict:'user_id,qid,period'});if(error)toast('تعذّر حفظ النتيجة. جدول التحديات غير جاهز بعد.');else await load()}}draw()},
lb:id=>{const Q=QZ.find(q=>q.id===id),L=S.att.filter(a=>a.qid===id&&a.period===pk(Q)).sort((a,b)=>b.score-a.score);sheet(`<h3>ترتيب: ${Q.n}</h3>${L.map((a,i)=>`<div class="row"><b style="flex:none">${i+1}</b>${av(S.people[a.user_id],28)}<b>${esc(nm(a.user_id))}</b>${a.score}</div>`).join('')||'<small>لا مشاركات.</small>'}`)},
edit:()=>{let emo=S.me.emoji;const d=sheet(`<h3>تعديل الملف الشخصي</h3><input id="sn" maxlength="30" value="${esc(S.me.full_name)}"><input id="sb" maxlength="100" placeholder="نبذة تعريفية" value="${esc(S.me.bio)}"><div class="emo">${EM.map(e=>`<button data-e="${e}" class="${e===emo?'on':''}">${e}</button>`).join('')}</div><button class="btn" id="ss">حفظ</button>`);d.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{emo=b.dataset.e;d.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',x===b))});d.querySelector('#ss').onclick=async()=>{const n=d.querySelector('#sn').value.trim();if(!n)return;d.remove();await W(sb.from('profiles').update({full_name:n,bio:d.querySelector('#sb').value.trim(),emoji:emo}).eq('id',S.uid))}},
delacc:()=>{const d=sheet('<h3>حذف الحساب؟</h3><p>سيتم حذف ملفك ومنشوراتك نهائياً.</p><button class="btn" style="background:var(--dg)" id="y">نعم، احذف حسابي</button>');d.querySelector('#y').onclick=async()=>{d.remove();const {error}=await sb.rpc('delete_my_account');if(error){toast(errAr(error));return}await sb.auth.signOut();S.uid=null;authView();toast('تم حذف الحساب')}}};
async function W(p){const r=await p;if(r&&r.error)throw r.error;await load();draw()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;if(b.tagName==='A')e.preventDefault();try{await A[b.dataset.a](b.dataset.id,b)}catch(x){toast(errAr(x))}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){S.q=e.target.value;draw()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&/^(ae|ap|an|au)$/.test(e.target.id))A.go()});
document.addEventListener('change',async e=>{const k=e.target.dataset.s;if(!k)return;try{await W(sb.from('profiles').update({[k]:e.target.value}).eq('id',S.uid))}catch(x){toast(errAr(x))}});
addEventListener('offline',()=>toast('انقطع الاتصال بالإنترنت'));addEventListener('online',()=>toast('عاد الاتصال'));
setInterval(async()=>{if(S.uid&&!document.hidden&&!document.querySelector('.ov')&&S.view!=='play'&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))){try{await load();draw()}catch(e){}}},15000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session){S.uid=data.session.user.id;await enter()}else authView()}catch(e){authView();toast('تعذّر الاتصال بالخادم')}
 setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),500)},900)})();
})();
</script></body></html>
